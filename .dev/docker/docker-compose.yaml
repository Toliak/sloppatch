services:
  dev:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:?Not specified}
        USERNAME: ${USERNAME:?Not specified}
        PASSWORD: ${PASSWORD:?Not specified}
        USER_UID: ${USER_UID:?Not specified}
        USER_GID: ${USER_GID:?Not specified}
        SSH_PUB_KEY: ${SSH_PUB_KEY:-}
        MCE_VERSION: ${MCE_VERSION:-}
        VSCODE_VERSION: ${VSCODE_VERSION:-}
    ports:
      - ${SSH_ADDR:?Not specified}:22
    environment:
      "TERM": "xterm-256color"
    volumes:
      - ../..:/opt/workdir
