name: CI/CD for sloppatch

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  tests-and-lint:
    name: Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Podman is installed
        run: |
          if ! command -v podman &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y podman
          fi
          podman --version

      - name: Build preparer stage only
        run: |
          cd docker
          make build-preparer

      - name: Run test
        run: |
          cd docker
          make ci CMD="test"

      - name: Run test-e2e
        run: |
          cd docker
          make ci CMD="test-e2e"

      - name: Run mypy
        run: |
          cd docker
          make ci CMD="mypy"

      - name: Run ruff
        run: |
          cd docker
          make ci CMD="ruff"

  release-build-and-upload:
    name: Release Build & Upload Artifacts
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Podman is installed
        run: |
          if ! command -v podman &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y podman
          fi
          podman --version

      - name: Build full image with target stage
        run: |
          cd docker
          make release

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "Sloppatch release"
          files: |
            dist/release/*
