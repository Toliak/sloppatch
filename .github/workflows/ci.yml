name: CI/CD for sloppatch

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

env:
  DOCKER_BUILD_CONTEXT: "."
  DOCKERFILE_PATH: "docker/build.Dockerfile"

jobs:
  tests-and-lint:
    name: Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build preparer stage only
        run: |
          docker buildx build \
            --file ${{ env.DOCKERFILE_PATH }} \
            --target preparer \
            --tag sloppatch-preparer:ci \
            --load \
            ${{ env.DOCKER_BUILD_CONTEXT }}

      - name: Run test
        run: |
          docker run --rm sloppatch-preparer:ci \
            sh -c "cd /opt/workdir && . ./.venv/bin/activate && make test"

      - name: Run test-e2e
        run: |
          docker run --rm sloppatch-preparer:ci \
            sh -c "cd /opt/workdir && . ./.venv/bin/activate && make test-e2e"

      - name: Run mypy
        run: |
          docker run --rm sloppatch-preparer:ci \
            sh -c "cd /opt/workdir && . ./.venv/bin/activate && make mypy"

      - name: Run ruff
        run: |
          docker run --rm sloppatch-preparer:ci \
            sh -c "cd /opt/workdir && . ./.venv/bin/activate && make ruff"

  release-build-and-upload:
    name: Release Build & Upload Artifacts
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build full image with target stage
        run: |
          docker buildx build \
            --file ${{ env.DOCKERFILE_PATH }} \
            --output type=local,dest=./dist-release \
            ${{ env.DOCKER_BUILD_CONTEXT }}

      - name: Extract artifacts
        run: |
          mkdir -p artifacts/whl
          mkdir -p artifacts/bin

          find ./dist-release/opt/sloppatch/dist-only -type f -name "sloppatch*.whl" -exec cp {} artifacts/whl/ \;
          cp ./dist-release/opt/sloppatch/bin/sloppatch artifacts/bin/

          ls -R artifacts/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "Sloppatch release"
          files: |
            artifacts/whl/*.whl
            artifacts/bin/sloppatch
